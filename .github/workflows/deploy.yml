name: Backend CD

on:
  push:
    branches: [ "main" ]

jobs:
  deploy:
    name: Deploy Backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via SSH
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || 22 }}
          script: |
            # 1. Truy cập thư mục repo Backend trên VPS và reset đồng bộ code mới nhất
            cd /var/www/movie-booking-app-fullstack/movie-backend-capstone
            git fetch origin
            git reset --hard origin/main
            cd ..
            
            # 2. Build lại và khởi chạy đúng container be
            docker compose -f docker-compose.prod.yml up -d --build be
            
            # 4. Chạy migration
            docker compose exec -T be npx prisma migrate deploy
            
            # 5. Dọn dẹp Docker rác
            docker image prune -f
